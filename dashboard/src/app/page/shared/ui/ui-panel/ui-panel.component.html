<mat-card appearance="outlined">
  @if (heading()) {
    <header>
      <div class="heading">
        <h3>{{ heading() }}</h3>
        @if (description()) {
          <p>{{ description() }}</p>
        }
      </div>
      <div class="actions"><ng-content select="[panel-actions]" /></div>
    </header>
  }
  <div class="body"><ng-content /></div>
</mat-card>
