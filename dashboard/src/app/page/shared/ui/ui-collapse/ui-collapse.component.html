<app-ui-panel [elevation]="elevation()">
  <div class="header">
    <button
      class="toggle"
      type="button"
      [disabled]="disabled()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="contentId"
      (click)="toggle()"
    >
      <span class="heading">
        <strong>{{ heading() }}</strong>
        @if (description()) {
          <span>{{ description() }}</span>
        }
        <span class="description"><ng-content select="[collapse-description]" /></span>
      </span>
      <app-ui-icon class="indicator" [class.expanded]="expanded()" name="chevron" />
    </button>
    <span class="trailing"><ng-content select="[collapse-trailing]" /></span>
  </div>
  @if (expanded()) {
    <div class="inner" [id]="contentId"><ng-content /></div>
  }
</app-ui-panel>
